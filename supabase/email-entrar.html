<h2 style="font-family:Arial,sans-serif;color:#0F5A50">Seu código para entrar</h2>
<p style="font-family:Arial,sans-serif;font-size:18px">Digite este código no App de Pesca:</p>
<p style="font-family:Arial,sans-serif;font-size:36px;font-weight:bold;letter-spacing:8px;color:#0b2e33">{{ .Token }}</p>
<p style="font-family:Arial,sans-serif;font-size:18px">Ou toque no botão, abrindo no mesmo celular:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0F5A50;color:#ffffff;font-family:Arial,sans-serif;font-size:20px;font-weight:bold;padding:16px 28px;border-radius:12px;text-decoration:none">Entrar no app</a></p>
<p style="font-family:Arial,sans-serif;font-size:16px;color:#555">Vale por pouco tempo e só funciona uma vez. Se não foi você que pediu, é só apagar este e-mail.</p>
