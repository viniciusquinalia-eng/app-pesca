/* agenda de dias livres e ocupados */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function calMes(k,ocup,edit){const off=(S.agm||{})[k]||0;const t=new Date();const d0=new Date(t.getFullYear(),t.getMonth()+off,1);const y=d0.getFullYear(),m=d0.getMonth();const nd=new Date(y,m+1,0).getDate();const hj=hojeL();
 let cel='';for(let i=0;i<d0.getDay();i++)cel+='<span></span>';
 for(let dd=1;dd<=nd;dd++){const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');const pas=iso<hj,oc=ocup.has(iso);
  cel+=edit&&!pas?`<button class="cd ${oc?'oc':'lv'}" data-act="agt" data-k="${k}" data-v="${iso}" aria-pressed="${oc}" aria-label="Dia ${dd}, ${oc?'ocupado':'livre'}">${dd}</button>`:`<span class="cd ${pas?'pas':oc?'oc':'lv'}"${pas?'':` aria-label="Dia ${dd}, ${oc?'ocupado':'livre'}"`}>${dd}</span>`}
 return `<div class="calm"><div class="calh"><button class="seta" data-act="agm" data-k="${k}" data-v="-1" ${off<=0?'disabled':''} aria-label="Mês anterior">‹</button><b>${MESES[m]} de ${y}</b><button class="seta" data-act="agm" data-k="${k}" data-v="1" ${off>=5?'disabled':''} aria-label="Próximo mês">›</button></div>
<div class="calg">${['D','S','T','Q','Q','S','S'].map(x=>`<i>${x}</i>`).join('')}${cel}</div><div class="calleg"><span><i class="cd lv"></i>Livre</span><span><i class="cd oc"></i>Ocupado</span></div></div>`}

${DEST.map(([k,n])=>sec(`Ranchos e pousadas · ${n}`,allAds().filter(a=>a.reg===k&&lugares(a)),'dest',k)).join('')}

${sec('Dicas de pontos de pesca',allAds().filter(a=>a.cat==='Ponto'),'cat','Ponto')}
${anunciar}`}

<label class="chip" style="display:flex;align-items:center;gap:10px;margin-top:14px;min-height:56px;height:auto;padding:10px 16px"><input type="checkbox" id="fa-tempt" ${e&&e.pontos&&e.pontos.length?'checked':''} > Quero mostrar os pontos de pesca que ofereço</label>
<div id="fa-pbox" style="${e&&e.pontos&&e.pontos.length?'':'display:none'}"><label class="f" for="fa-pontos">Pontos de pesca, um por linha</label><textarea id="fa-pontos" maxlength="400" style="width:100%;height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:17px" placeholder="Galhadas no braço da represa&#10;Píer iluminado para pesca à noite">${esc(e&&e.pontos?e.pontos.join('\n'):'')}</textarea><p class="m" style="margin-top:4px">Só o tipo de lugar. Nunca coordenada ou endereço do ponto.</p></div>

<label class="f" for="fa-wa">WhatsApp para contato (com DDD)</label><input id="fa-wa" type="tel" inputmode="tel" maxlength="20" value="${v('wa')}" placeholder="(14) 99999-9999">

/* ---------- clima (Open-Meteo, grátis, sem cadastro) ---------- */
const WX={};
const WTXT=c=>c===0?'Sol':c<=2?'Sol com nuvens':c===3?'Nublado':c<=48?'Neblina':c<=57?'Garoa':c<=67?'Chuva':c<=77?'Frio intenso':c<=82?'Pancadas de chuva':'Temporal';
const SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
async function geo(c){const k='bp_geo_'+norm(c);const g=ls.get(k,null);if(g)return g;
 const j=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&countryCode=BR&name='+encodeURIComponent(c))).json();
 const x=j&&j.results&&j.results[0];if(!x)return null;const o={lat:x.latitude,lon:x.longitude,nome:x.name+(x.admin1?', '+x.admin1:'')};ls.set(k,o);return o}
function clima(local,ini,fim){const c=cidade(local);if(!c)return null;const k=c+'|'+(ini||'agora')+'|'+(fim||'');
 if(WX[k]&&!(WX[k].st==='ok'&&Date.now()-WX[k].t>3*36e5))return WX[k];WX[k]={st:'carregando'};
 (async()=>{try{const g=await geo(c);if(!g){WX[k]={st:'sem'};render();return}
  let u='https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+'&timezone=America%2FSao_Paulo&wind_speed_unit=kmh';
  u+=ini?'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&start_date='+ini+'&end_date='+(fim||ini):'&current=temperature_2m,weather_code,wind_speed_10m';
  const j=await (await fetch(u)).json();WX[k]=j&&!j.error?{st:'ok',g,j,t:Date.now()}:{st:'sem'}}catch(e){WX[k]={st:'erro'}}render()})();
 return WX[k]}
const addDias=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
function vClimaPescaria(p){if(!p.inicio||!p.local||daysTo(fimDe(p))<0)return '';const c=cidade(p.local);if(!c)return '';
 if(daysTo(p.inicio)>15)return `<div class="box wx" style="margin-top:16px"><b>Tempo em ${esc(c)}</b><br>A previsão aparece a partir de ${esc(fmtD(addDias(p.inicio,-15)))}, 16 dias antes da viagem.</div>`;
 const ini=daysTo(p.inicio)<0?today():p.inicio;let fim=fimDe(p);if(daysTo(fim)>15)fim=addDias(today(),15);
 const w=clima(p.local,ini,fim);if(!w||w.st==='carregando')return `<div class="box wx" style="margin-top:16px"><b>Tempo em ${esc(c)}</b><br><span class="m">Buscando a previsão…</span></div>`;
 if(w.st!=='ok')return '';const d=w.j.daily;if(!d||!d.time)return '';
 return `<div class="box wx" style="margin-top:16px"><b>Previsão do tempo · ${esc(w.g.nome)}</b><div class="list" style="margin-top:6px;border:0;background:none;box-shadow:none;padding:0">${d.time.map((t,i)=>{const ch=d.precipitation_probability_max[i],vt=d.wind_speed_10m_max[i];const ruim=ch>=70||vt>=35;return `<div class="li" style="padding:10px 0;${ruim?'color:var(--warn)':''}"><div class="ic" style="width:auto;min-width:56px;padding:0 6px">${SEM[new Date(t+'T12:00').getDay()]} ${Number(t.slice(8))}</div><div class="grow"><div class="t" style="font-size:17px">${WTXT(d.weather_code[i])} · ${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div><div class="m" style="${ruim?'color:var(--warn)':''}">Chuva ${ch==null?'?':ch+'%'} · vento até ${Math.round(vt)} km/h${ruim?' · atenção no barco':''}</div></div></div>`}).join('')}</div><p class="m" style="margin:6px 0 0">Previsão do Open-Meteo. Confira de novo na véspera.</p></div>`}
function vClimaAgora(local){const w=clima(local);if(!w||w.st!=='ok'||!w.j.current)return '';const c=w.j.current;
 return `<div class="box wx"><b>Tempo agora em ${esc(w.g.nome)}:</b> ${Math.round(c.temperature_2m)}°, ${WTXT(c.weather_code).toLowerCase()}, vento ${Math.round(c.wind_speed_10m)} km/h</div>`}

async function prepFoto(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
 const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 let q=.75,b=null;do{b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.15}while(b&&b.size>300000&&q>.3);return b}finally{URL.revokeObjectURL(url)}}

else if(a==='modav'||a==='moddi'){const {error}=await sb.rpc(a==='modav'?'ocultar_avaliacao':'ocultar_diario',{p_id:v,p_oculto:el.dataset.o==='1'});if(error){flash('Não deu agora.');return}await loadPad();flash(el.dataset.o==='1'?'Escondido.':'Aparece de novo.')}
else if(a==='waad'){evento(v,'whatsapp')}
else if(a==='sair'){ls.set('bp_eh_admin',0);S.admAuto=false;ADMIN=false;await sb.auth.signOut();P=[];S.pid=null;render()}
else if(a==='apagarConta'){openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Apagar sua conta?</h2><p>Você sai de todas as pescarias. As pescarias que você criou são apagadas para toda a turma. Não dá para desfazer.</p><button class="btn full" data-act="apagarOk" style="background:var(--warn)">Apagar minha conta</button><button class="btn alt full" data-act="mclose" style="margin-top:8px">Cancelar</button></div></div>`)}
else if(a==='apagarOk'){/* LGPD: apaga também as fotos da pessoa no armazenamento */try{const r=await sb.storage.from('diario').list(user.id,{limit:1000});const fs=(r.data||[]).map(x=>user.id+'/'+x.name);if(fs.length)await sb.storage.from('diario').remove(fs)}catch(e){}
 const {error}=await sb.rpc('apagar_minha_conta');closeModal();if(error){flash('Não deu para apagar agora.');return}await sb.auth.signOut();P=[];render()}
else if(a==='open'){S.pid=v;S.sub='turma';render();scrollTo(0,0)}
else if(a==='close'){S.pid=null;render()}
else if(a==='sub'){S.sub=v;render()}
else if(a==='addp'){const n=$('#np').value.trim();if(!n)return;change(p=>{p.pessoas.push({id:uid(),nome:n,pix:''})})}
else if(a==='rmp'){change(p=>{p.pessoas=p.pessoas.filter(x=>x.id!==v)})}
else if(a==='pixkey'){const p=curP();const x=p.pessoas.find(y=>y.id===v);openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Chave Pix de ${esc(x.nome)}</h2><p class="m">Usada para gerar a cobrança quando alguém precisar pagar ${esc(x.nome)}.</p><label class="f" for="pk">Chave (CPF, celular, e-mail ou aleatória)</label><input id="pk" value="${esc(x.pix||'')}"><label class="f" for="pc">Cidade</label><input id="pc" value="${esc(x.cidade||'')}" placeholder="Bauru"><button class="btn full" data-act="savepix" data-v="${x.id}" style="margin-top:14px">Salvar</button></div></div>`)}
else if(a==='savepix'){const k=$('#pk').value.trim(),c=$('#pc').value.trim();change(p=>{const x=p.pessoas.find(y=>y.id===v);if(x){x.pix=k;x.cidade=c}});closeModal()}
else if(a==='adddata'){const i=$('#di').value,f2=$('#df').value;if(!i)return;change(p=>{p.datas=p.datas||[];p.datas.push({id:uid(),ini:i,fim:f2||i,votos:[]})})}
else if(a==='vote'){const eu=me(S.pid);change(p=>{const o=p.datas.find(x=>x.id===v);if(!o)return;o.votos=o.votos||[];o.votos=o.votos.includes(eu)?o.votos.filter(x=>x!==eu):[...o.votos,eu]})}
else if(a==='pick'){change(p=>{const o=p.datas.find(x=>x.id===v);if(o){p.inicio=o.ini;p.fim=o.fim}});flash('Data fechada!')}
else if(a==='tick'){change(p=>{const it=p.itens.find(i=>i.id===v);if(it)it.ok=!it.ok})}
else if(a==='rmi'){change(p=>{p.itens=p.itens.filter(i=>i.id!==v)})}
else if(a==='addi'){const t=$('#ni').value.trim();if(!t)return;change(p=>{p.itens.push({id:uid(),txt:t,quem:'',ok:false})})}
else if(a==='addr'){const t=$('#rt').value.trim();if(!t)return;const dia=$('#rd').value.trim(),hora=$('#rh').value;change(p=>{p.roteiro=p.roteiro||[];p.roteiro.push({id:uid(),dia,hora,txt:t})})}
else if(a==='rmr'){change(p=>{p.roteiro=p.roteiro.filter(r=>r.id!==v)})}
else if(a==='novogasto'){const p=curP();if(p)openModal(formGasto(p))}
else if(a==='cdet'){setTimeout(()=>{const d=$('.cdet');S.cdet=!!(d&&d.open)},0)}
else if(a==='addg'){const d=$('#gd').value.trim();const val=valorBR($('#gv').value);const parts=[...document.querySelectorAll('.gpart:checked')].map(x=>x.value);if(!d||!(val>0)){flash('Preencha o gasto e o valor.');return}if(!parts.length){flash('Escolha quem divide.');return}const quem=$('#gp').value;change(p=>{p.gastos=p.gastos||[];p.gastos.push({id:uid(),desc:d,valor:Math.round(val*100)/100,pagou:quem,parts})});closeModal();flash('Gasto lançado.')}
else if(a==='lic'){const p=curP();const x=p.pessoas.find(y=>y.id===v);if(!x)return;openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Licença de pesca de ${esc(x.nome)}</h2><p class="m">Na pesca amadora, cada pescador precisa da licença em dia. Ela é tirada no site do Ministério da Pesca (gov.br). Informe até quando a licença vale.</p><label class="f" for="lv">Vale até</label><input id="lv" type="date" value="${esc(x.lic||'')}"><button class="btn full" data-act="savelic" data-v="${x.id}" style="margin-top:14px">Salvar</button>${x.lic?`<button class="btn ghost full" data-act="clrlic" data-v="${x.id}">Tirar a data</button>`:''}</div></div>`)}
else if(a==='savelic'){const d=$('#lv').value;if(!d){$('#lv').focus();return}change(p=>{const x=p.pessoas.find(y=>y.id===v);if(x)x.lic=d});closeModal()}
else if(a==='clrlic'){change(p=>{const x=p.pessoas.find(y=>y.id===v);if(x)delete x.lic});closeModal()}
else if(a==='edg'){const p=curP();const g=(p.gastos||[]).find(y=>y.id===v);if(!g)return;const ppl=p.pessoas||[];openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Mudar gasto</h2>
<label class="f" for="egd">O que foi</label><input id="egd" value="${esc(g.desc)}">
<label class="f" for="egv">Valor (R$)</label><input id="egv" type="text" inputmode="decimal" autocomplete="off" value="${esc(String(g.valor).replace('.',','))}">
<label class="f" for="egp">Quem pagou</label><select id="egp">${ppl.map(x=>`<option value="${x.id}" ${x.id===g.pagou?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
<label class="f">Divide entre</label><div class="parts">${ppl.map(x=>`<label class="chip" style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" class="egpart" value="${x.id}" ${(g.parts||[]).includes(x.id)?'checked':''}>${esc(x.nome)}</label>`).join('')}</div>
<button class="btn full" data-act="saveg" data-v="${g.id}" style="margin-top:16px">Salvar</button><button class="btn ghost full" data-act="rmg" data-v="${g.id}">Apagar este gasto</button></div></div>`)}
else if(a==='saveg'){const d=$('#egd').value.trim();const val=valorBR($('#egv').value);const parts=[...document.querySelectorAll('.egpart:checked')].map(x=>x.value);if(!d||!(val>0)){flash('Preencha o gasto e o valor.');return}if(!parts.length){flash('Escolha quem divide.');return}const pg=$('#egp').value;change(p=>{const g=p.gastos.find(y=>y.id===v);if(g){g.desc=d;g.valor=val;g.pagou=pg;g.parts=parts}});closeModal()}
else if(a==='rmg'){closeModal();change(p=>{p.gastos=p.gastos.filter(g=>g.id!==v)})}
else if(a==='pago'){change(p=>{p.pagos=p.pagos||{};p.pagos[v]=true})}
else if(a==='unpago'){change(p=>{p.pagos=p.pagos||{};delete p.pagos[v]})}
else if(a==='pixgo'){const p=curP();const [de,para]=v.split('>');const x=p.pessoas.find(y=>y.id===para);const val=Number(el.dataset.n);
if(!x||!x.pix){openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Falta a chave Pix</h2><p>${esc(x?x.nome:'')} ainda não cadastrou a chave Pix. Vá em Turma e toque em Pix ao lado do nome.</p><button class="btn full" data-act="mclose">Entendi</button></div></div>`);return}
const code=pix(x.pix,x.nome,x.cidade,val);openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">${esc(pname(p,de))} paga ${brl(val)} para ${esc(x.nome)}</h2><p class="m">Copie o código e cole no app do banco, em Pix copia e cola.</p><textarea class="code" readonly id="pixcode">${esc(code)}</textarea><button class="btn full" data-act="copy" data-t="pixcode" style="margin-top:12px">Copiar código Pix</button><button class="btn alt full" data-act="mclose" style="margin-top:8px">Fechar</button></div></div>`)}
else if(a==='copy'){const t=$('#'+el.dataset.t);try{await navigator.clipboard.writeText(t.value);el.textContent='Copiado!'}catch(err){t.select();el.textContent='Selecione e copie'}}
else if(a==='wa'){const p=curP();if(!p)return;const txt=waText(p,v);openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Mensagem pronta</h2><p class="m">Confira e toque em Abrir WhatsApp. Lá você escolhe o grupo da turma.</p><textarea class="code" readonly id="watxt" style="font-family:inherit;font-size:16px;height:220px">${esc(txt)}</textarea><button class="btn wa full" data-act="waopen" style="margin-top:12px">Abrir WhatsApp</button><button class="btn alt full" data-act="copy" data-t="watxt" style="margin-top:8px">Só copiar o texto</button></div></div>`)}
else if(a==='waopen'){waOpen($('#watxt').value)}
else if(a==='convite'){const p=curP();const txt=`Bora pescar? ${p.nome}${p.local?' em '+p.local:''}${p.inicio?', '+fmtD(p.inicio)+(p.fim&&p.fim!==p.inicio?' a '+fmtD(p.fim):''):''}. Entra no app ${APP}, abre a pescaria e confirma presença.`;openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Convite</h2><textarea class="code" readonly id="cv" style="font-family:inherit;font-size:15px">${esc(txt)}</textarea><button class="btn full" data-act="copy" data-t="cv" style="margin-top:12px">Copiar convite</button></div></div>`)}
else if(a==='delp'){openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Apagar esta pescaria?</h2><p>Some para toda a turma, com gastos e lista.</p><button class="btn full" data-act="delok" style="background:var(--warn)">Apagar</button><button class="btn alt full" data-act="mclose" style="margin-top:8px">Cancelar</button></div></div>`)}
else if(a==='delok'){store().del(S.pid);S.pid=null;closeModal()}
}finally{delete OCUPADO[a]}});
(()=>{const q=new URLSearchParams(location.search);const c=q.get('c');const ad=q.get('ad');if(c)ls.set('bp_convite',c);
 if(ad&&/^[a-z0-9_-]{1,60}$/i.test(ad)){S.ad=ad;S.ex=null}
 if(c||ad)history.replaceState(null,'',location.pathname+(ad?'#explorar':location.hash))})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
const route0=()=>{const h=location.hash.slice(1);if(h.startsWith('c=')){const c=h.slice(2);history.replaceState(null,'','#pescarias');if(mode==='local'){flash('Convite só funciona com o app ligado na internet.')}else if(user){cloud.join(c).then(id=>{if(id){S.tab='pescarias';S.pid=id;S.sub='turma';render()}})}else{ls.set('bp_convite',c);S.convidado=true}}S.tabPadrao=!TABS.includes(h);S.tab=TABS.includes(h)?h:DEFTAB[area()];if(S.tab!=='explorar')S.ad=null;if(S.tab!=='pescarias')S.pid=null;render();scrollTo(0,0)};
const route=()=>{route0();if(S.tab==='explorar'){S.ex=S.ex||null;loadAds()}};
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
