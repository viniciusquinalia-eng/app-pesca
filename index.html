<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turma da Pesca</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5A50">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: simples e direto, como app de banco e de hospedagem; letra grande para todas as idades
   IDEA: o caderninho da pescaria da turma, no bolso
   PICTURE: cenas planas de rio, rancho e barco nos cards
   COLOUR and TYPE: branco, verde-rio #0F5A50 dominante, amarelo-tucunaré só em detalhes; Inter
   LAYOUT: coluna de celular, menu de 3 abas embaixo, um assunto por tela */
:root{color-scheme:light;
--bg:#ffffff;--card:#ffffff;--soft:#f4f6f5;--soft2:#eef2f0;
--ink:#0b2e33;--ink2:#2c4a4e;--mute:#5a6b68;--line:#e4eae8;
--brand:#0f5a50;--brand2:#0b463e;--brandsoft:#e6f0ed;--onbrand:#ffffff;--sun:#f2b035;--sunsoft:#fdf1d6;
--warn:#a33f0b;--warnbg:#fdeee3;--wa:#1d7a4c;
--sh:0 1px 2px rgba(11,46,51,.05),0 6px 20px rgba(11,46,51,.07);--r:22px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 18px 120px}
h1{font-size:32px;line-height:1.08;letter-spacing:-.03em;margin:22px 0 16px;font-weight:800;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em;margin:28px 0 12px;font-weight:700}
.eyebrow{font-size:15px;font-weight:600;color:var(--mute);margin:26px 0 -14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:56px;padding:0 22px;border-radius:16px;border:0;background:var(--brand);color:var(--onbrand);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.full{width:100%}
.btn.ghost{background:none;color:var(--warn);min-height:52px}
.btn.sm{min-height:48px;padding:0 18px;font-size:16px;border-radius:14px}
.btn.wa{background:var(--wa);color:#fff}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,.back:focus-visible,.check:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select{width:100%;height:56px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;background:var(--card);font-size:17px;transition:border-color .15s}
input:focus,select:focus{border-color:var(--brand);outline:none}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
label.f{display:block;font-size:16px;font-weight:600;color:var(--ink2);margin:16px 0 8px}
.search{display:flex;align-items:center;gap:10px;height:58px;border-radius:29px;padding:0 20px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line)}
.search input{border:0;height:auto;padding:0;background:transparent;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:48px;padding:0 18px;border-radius:24px;border:0;background:var(--soft);font-size:16px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--brand);color:var(--onbrand)}
.card{display:block;width:100%;text-align:left;border:0;background:none;padding:0;margin:18px 0 6px;color:inherit}
.pic{border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/10;background:#f4c46e}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:12px;top:12px;background:#fff;color:#0b2e33;font-size:15px;font-weight:700;padding:6px 12px;border-radius:14px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-top:10px}
.t{font-size:18px;font-weight:700;letter-spacing:-.01em}.m{color:var(--mute);font-size:16px}.price{font-weight:700;white-space:nowrap}
.note{font-size:15px;color:var(--mute);margin:14px 0 0}
.box{background:var(--soft);border-radius:18px;padding:16px 18px;margin:12px 0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:14px 16px;font-size:16px;margin-top:14px}
.money,.big,.num{font-variant-numeric:tabular-nums}
/* cartão de pescaria */
.pcard{background:var(--card);border-radius:26px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.pcard .pic{border-radius:0;aspect-ratio:16/7}
.pcard .body{padding:16px 18px 18px}
.count{position:absolute;left:14px;bottom:14px;background:var(--sun);color:#3a2a00;font-weight:800;font-size:16px;padding:7px 14px;border-radius:999px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);font-size:16px;margin-top:2px}
.faces{display:flex;align-items:center;margin-top:14px}
.faces .av{margin-left:-8px;box-shadow:0 0 0 3px #fff}.faces .av:first-child{margin-left:0}
.faces span.m{margin-left:10px}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:17px;color:#fff}
.av.s{width:36px;height:36px;font-size:15px}
/* cabeçalho da pescaria */
.top{position:relative;margin:0 -18px}
.top .pic{border-radius:0 0 28px 28px;aspect-ratio:16/9}
.top .back{position:absolute;left:14px;top:14px;margin:0;background:rgba(255,255,255,.92);box-shadow:var(--sh)}
.title{margin:18px 0 0}
.title h1{margin:0 0 6px}
/* abas da pescaria */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
/* listas agrupadas */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1}
.ic{width:48px;height:48px;border-radius:14px;background:var(--brandsoft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(12px + env(safe-area-inset-bottom));z-index:5}
.nav a{flex:0 1 150px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--mute);text-decoration:none;padding:2px 0;min-height:56px}
.nav a i{display:flex;align-items:center;justify-content:center;width:60px;height:32px;border-radius:16px;font-style:normal}
.nav a.on{color:var(--brand)}.nav a.on i{background:var(--brandsoft)}
.back{width:48px;height:48px;border-radius:24px;border:0;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;margin-top:18px;color:var(--ink)}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.feat div{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:15px;font-weight:600}
.sticky{position:fixed;left:0;right:0;bottom:84px;background:var(--bg);border-top:1px solid var(--line)}
.sticky>div{max-width:520px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.check{width:44px;height:44px;border-radius:12px;border:2px solid #b9c9c5;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:var(--onbrand)}
.check.on{background:var(--brand);border-color:var(--brand)}
.x{border:0;background:none;color:var(--mute);font-size:26px;width:48px;height:48px;border-radius:24px;flex:none}
.money{font-weight:800;white-space:nowrap}
.pill{font-size:15px;font-weight:700;color:var(--brand)}
/* contas */
.saldo{background:var(--brand);color:var(--onbrand);border-radius:26px;padding:22px 22px 20px;margin:16px 0 4px}
.saldo .lbl{display:inline-flex;align-items:center;gap:8px;font-weight:600;opacity:.92}
.saldo .lbl:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun)}
.saldo .big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.saldo .sub{opacity:.85;font-size:16px}
.tr{padding:16px}
.tr .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr .arrow{color:var(--mute)}
.tr .acts{display:flex;gap:8px;margin-top:12px}.tr .acts .btn{flex:1}
.tr.pago .who,.tr.pago .money{opacity:.5}
.hero{background:var(--brand);color:var(--onbrand);border-radius:26px;padding:22px;margin:4px 0 8px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0}
.share{background:var(--brandsoft);border-radius:var(--r);padding:18px;margin-top:28px}
.share h2{margin:0 0 4px}
.modal{position:fixed;inset:0;background:rgba(6,24,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:12px 20px 30px;max-height:90vh;overflow:auto}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
textarea.code{width:100%;height:110px;border-radius:14px;border:1.5px solid var(--line);padding:12px;font:15px/1.45 ui-monospace,monospace;background:var(--soft);color:var(--ink);overflow-wrap:anywhere}
.status{font-size:15px;color:var(--mute);text-align:center;margin-top:10px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts .chip{background:var(--card);border:1.5px solid var(--line)}
.parts .chip:has(input:checked){background:var(--brandsoft);border-color:var(--brand);color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>

let P=[];let loading=false;let loadNote='';
const CFG=window.BORA_CONFIG||{};
const sb=(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const mode=sb?'cloud':'local';
let user=null;let authReady=!sb;
const clone=o=>JSON.parse(JSON.stringify(o));
const putLocal=p=>{const i=P.findIndex(x=>x.id===p.id);if(i<0)P.push(p);else P[i]=p};
const local={
 list(){P=ls.get('bp_pescarias',[])},
 create(p){putLocal(p);ls.set('bp_pescarias',P);render();return Promise.resolve(p.id)},
 change(id,fn){const p=getP(id);if(!p)return;const c=clone(p);fn(c);putLocal(c);ls.set('bp_pescarias',P);render()},
 del(id){P=P.filter(x=>x.id!==id);ls.set('bp_pescarias',P);render()}};
const queue={};
/* base = última versão confirmada pelo banco; pend = mudanças desta pessoa ainda a caminho.
   A tela mostra base + pend, assim uma atualização vinda do banco nunca apaga o que a pessoa acabou de fazer. */
const base={};const pend={};
const rowToP=r=>({...r.dados,id:r.id,_v:r.versao,_convite:r.convite});
const view=id=>{const c=clone(base[id]);(pend[id]||[]).forEach(f=>{try{f(c)}catch(e){console.error(e)}});return c};
const cloud={
 async list(){if(!user)return;loading=!P.length;render();
  const {data,error}=await sb.rpc('minhas_pescarias');
  loading=false;if(error){console.error('minhas_pescarias',error);loadNote='Não deu para carregar as pescarias. Confira a internet.';render();return}
  loadNote='';data.forEach(r=>{base[r.id]=rowToP(r)});P=data.map(r=>view(r.id));render()},
 async create(p){const {id,_v,_convite,...dados}=p;const {data,error}=await sb.rpc('criar_pescaria',{p_dados:dados});
  if(error||!data||!data.length){flash('Não deu para criar agora. Tente de novo.');return null}
  const r=data[0];base[r.id]={...clone(dados),id:r.id,_v:1,_convite:r.convite};putLocal(view(r.id));render();return r.id},
 change(id,fn){if(!base[id])return;(pend[id]=pend[id]||[]).push(fn);putLocal(view(id));render();
  queue[id]=(queue[id]||Promise.resolve()).then(()=>cloud._send(id,fn)).catch(e=>{console.error(e);pend[id]=(pend[id]||[]).filter(f=>f!==fn);putLocal(view(id));render();flash('Não salvou agora. Confira a internet e tente de novo.')})},
 async _send(id,fn){
  for(let t=0;t<6;t++){
   const c=clone(base[id]);fn(c);const {id:_i,_v,_convite,...dados}=c;
   const {data,error}=await sb.rpc('salvar_pescaria',{p_id:id,p_dados:dados,p_versao:base[id]._v});
   if(error)throw error;
   if(data>0){c._v=data;base[id]=c;pend[id]=(pend[id]||[]).filter(f=>f!==fn);putLocal(view(id));render();return}
   /* outra pessoa mexeu ao mesmo tempo: busca a versão nova e refaz a mudança em cima dela */
   const r=await sb.rpc('minhas_pescarias',{p_id:id});
   if(r.error||!r.data||!r.data.length)throw r.error||new Error('sumiu');base[id]=rowToP(r.data[0]);putLocal(view(id));render()}
  throw new Error('conflito')},
 async del(id){P=P.filter(x=>x.id!==id);render();const {error}=await sb.rpc('apagar_pescaria',{p_id:id});if(error)flash('Não apagou agora.')},
 async join(convite){const {data,error}=await sb.rpc('entrar_pescaria',{p_convite:convite});if(error||!data){flash('Convite não encontrado. Peça o link de novo para quem organizou.');return null}await cloud.list();return data}};
const store=()=>mode==='cloud'?cloud:local;
const save=p=>store().change(p.id,c=>Object.assign(c,clone(p)));
if(mode==='local')local.list();
else{
 sb.auth.getSession().then(({data})=>{user=data.session?.user||null;authReady=true;afterLogin()});
 sb.auth.onAuthStateChange((ev,s)=>{const was=user;user=s?.user||null;authReady=true;if(!was&&user)afterLogin();else render()});
 /* busca de novo quando a pessoa volta para o app e a cada 20 s, para ver o que a turma mudou */
 addEventListener('focus',()=>user&&cloud.list());
 setInterval(()=>{if(user&&document.visibilityState==='visible'&&!$('#modal').innerHTML&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))cloud.list()},20000)}
async function afterLogin(){
 if(!user){render();return}
 const pend=ls.get('bp_convite','');
 if(pend){ls.set('bp_convite','');const id=await cloud.join(pend);if(id){S.tab='pescarias';S.pid=id;S.sub='turma';history.replaceState(null,'','#pescarias')}}
 else await cloud.list();
 render()}

/* ---------- estado da tela ---------- */
const S={tab:'pescarias',q:'',cat:'',pil:false,ad:null,pid:null,sub:'turma',cid:null};
const me=pid=>ls.get('bp_me_'+pid,'');
const setMe=(pid,v)=>{ls.set('bp_me_'+pid,v);render()};
const getP=id=>P.find(p=>p.id===id);
const pname=(p,id)=>(p.pessoas||[]).find(x=>x.id===id)?.nome||'?';
let flashMsg='';const flash=m=>{flashMsg=m;render();setTimeout(()=>{flashMsg='';render()},3500)};

/* ---------- contas ---------- */
const balances=p=>{const b={};(p.pessoas||[]).forEach(x=>b[x.id]=0);(p.gastos||[]).forEach(g=>{const parts=(g.parts||[]).filter(id=>id in b);if(!parts.length||!(g.pagou in b))return;b[g.pagou]+=g.valor;const share=g.valor/parts.length;parts.forEach(id=>b[id]-=share)});return b};
const settle=p=>{const b=balances(p);const cred=[],deb=[];Object.entries(b).forEach(([id,v])=>{if(v>0.009)cred.push([id,v]);else if(v<-0.009)deb.push([id,-v])});cred.sort((a,c)=>c[1]-a[1]);deb.sort((a,c)=>c[1]-a[1]);const out=[];let i=0,j=0;while(i<deb.length&&j<cred.length){const v=Math.min(deb[i][1],cred[j][1]);out.push({de:deb[i][0],para:cred[j][0],v:Math.round(v*100)/100});deb[i][1]-=v;cred[j][1]-=v;if(deb[i][1]<0.009)i++;if(cred[j][1]<0.009)j++}return out};
const valorBR=t=>{t=String(t||'').replace(/[^0-9.,]/g,'');if(!t)return NaN;const c=t.lastIndexOf(','),d=t.lastIndexOf('.');let dec=c>d?',':(d>c&&t.length-d-1!==3?'.':null);if(dec===null&&c<0&&d>=0&&(t.match(/\./g)||[]).length===1&&t.length-d-1!==3)dec='.';let n=dec?t.slice(0,t.lastIndexOf(dec)).replace(/[.,]/g,'')+'.'+t.slice(t.lastIndexOf(dec)+1):t.replace(/[.,]/g,'');return Math.round(parseFloat(n)*100)/100};
const total=p=>(p.gastos||[]).reduce((s,g)=>s+g.valor,0);

/* ---------- Pix copia e cola (BR Code estático) ---------- */
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim();
const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const crc=s=>{let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};
const pix=(chave,nome,cidade,valor)=>{let s=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',chave.trim()))+f('52','0000')+f('53','986')+f('54',valor.toFixed(2))+f('58','BR')+f('59',(norm(nome)||'RECEBEDOR').slice(0,25))+f('60',(norm(cidade)||'BRASIL').slice(0,15))+f('62',f('05','***'))+'6304';return s+crc(s)};

const WA_LABEL={turma:'Mandar convite no WhatsApp',datas:'Mandar votação de datas',levar:'Mandar lista do que levar',roteiro:'Mandar roteiro',contas:'Mandar acerto no WhatsApp'};
const quando=p=>p.inicio?fmtD(p.inicio)+(p.fim&&p.fim!==p.inicio?' a '+fmtD(p.fim):''):'data a combinar';
const linkConvite=p=>p._convite?location.origin+location.pathname+'#c='+p._convite:'';
const waText=(p,k)=>{const L=[];const lk=linkConvite(p);const t='*'+p.nome+'*'+(p.local?' em '+p.local:'')+' · '+quando(p);
if(k==='convite'){L.push('Bora pescar? 🎣',t,'','Turma até agora: '+(p.pessoas||[]).map(x=>x.nome).join(', ')+'.');L.push('','🎫 Lembrete: leve a licença de pesca amadora em dia.');if(lk)L.push('','Toque no link, entre e escolha seu nome:',lk);else L.push('Responde aqui se você vai!')}
else if(k==='datas'){L.push('🎣 '+p.nome+' · qual data dá pra você?','');(p.datas||[]).forEach((o,i)=>L.push((i+1)+') '+fmtD(o.ini)+(o.fim&&o.fim!==o.ini?' a '+fmtD(o.fim):'')+((o.votos||[]).length?' · podem: '+o.votos.map(id=>pname(p,id)).join(', '):'')));if(!(p.datas||[]).length)L.push('Ainda sem datas sugeridas.');L.push('','Responde com o número da data.')}
else if(k==='levar'){L.push('🎣 '+t,'','*Quem leva o quê*');(p.itens||[]).forEach(it=>L.push((it.ok?'✅ ':'▫️ ')+it.txt+' · '+(it.quem?pname(p,it.quem):'falta alguém pegar')));const sl=semLic(p);if(sl.length)L.push('','🎫 Licença de pesca ainda não informada: '+sl.map(x=>x.nome).join(', '))}
else if(k==='roteiro'){L.push('🎣 '+t,'','*Roteiro*');(p.roteiro||[]).forEach(r=>L.push([r.dia,r.hora].filter(Boolean).join(' ')+' · '+r.txt));if(!(p.roteiro||[]).length)L.push('Roteiro ainda não montado.')}
else if(k==='contas'){const st=settle(p);const pg=p.pagos||{};L.push('🎣 '+p.nome+' · *acerto das contas*','Total: '+brl(total(p))+' · '+(p.pessoas||[]).length+' pessoas','');
(p.gastos||[]).forEach(g=>L.push('• '+g.desc+': '+brl(g.valor)+' ('+pname(p,g.pagou)+' pagou)'));L.push('');
if(!st.length)L.push('Ninguém deve nada. 👍');
st.forEach(s2=>{const k2=s2.de+'>'+s2.para;const x=(p.pessoas||[]).find(y=>y.id===s2.para);L.push('*'+pname(p,s2.de)+' paga '+brl(s2.v)+' para '+pname(p,s2.para)+'*'+(pg[k2]?' ✅ pago':''));if(!pg[k2]){if(x&&x.pix){L.push('Pix copia e cola:',pix(x.pix,x.nome,x.cidade,s2.v))}else L.push('(falta a chave Pix de '+pname(p,s2.para)+')')}L.push('')});
L.push('Calculado no '+APP+'. O app não mexe em dinheiro: cada um paga direto pelo banco.')}
if(lk&&k!=='convite')L.push('','Abrir a pescaria: '+lk);return L.join('\n')};

function vPescaria(p){

const d=p.inicio?daysTo(p.inicio):null;const eu=me(p.id);
const subs=[['turma','Turma'],['datas','Datas'],['levar','Quem leva'],['roteiro','Roteiro'],['contas','Contas']];

function vContasBody(p){
const ppl=p.pessoas||[];
if(ppl.length<2)return `<div class="box">Adicione pelo menos 2 pescadores na aba Turma para dividir as contas.</div>`;
const eu=me(p.id);const st=settle(p);const b=balances(p);const pagos=p.pagos||{};
const meu=eu?b[eu]||0:null;
return `<div class="saldo"><div class="lbl">${eu?(meu>=0?'Você tem a receber':'Você deve'):'Total da pescaria'}</div><div class="big">${eu?brl(Math.abs(meu)):brl(total(p))}</div>${eu?`<div class="sub">Total da pescaria: ${brl(total(p))} · ${ppl.length} pessoas</div>`:''}</div>
<h2>Acerto</h2>${st.length?`<div class="list">${st.map(s=>{const k=s.de+'>'+s.para;const pg=!!pagos[k];return `<div class="tr ${pg?'pago':''}" style="border-bottom:1px solid var(--line)"><div class="who" style="flex-wrap:nowrap;gap:12px"><span class="faces" style="margin:0;flex:none">${av(pname(p,s.de),'s')}${av(pname(p,s.para),'s')}</span><div style="flex:1"><div style="font-size:17px"><b>${esc(pname(p,s.de))}</b> <span class="arrow">paga</span> <b>${esc(pname(p,s.para))}</b></div><div class="money" style="font-size:22px">${brl(s.v)}</div></div></div><div class="acts">${pg?`<button class="btn sm alt" data-act="unpago" data-v="${esc(k)}">${I.ok} Pago</button>`:`<button class="btn sm" data-act="pixgo" data-v="${esc(k)}" data-n="${s.v}">Gerar Pix</button><button class="btn sm alt" data-act="pago" data-v="${esc(k)}">Já paguei</button>`}</div></div>`}).join('')}</div>`:'<p class="m">Ninguém deve nada. Lance os gastos abaixo.</p>'}
<h2>Gastos</h2><div class="list">${(p.gastos||[]).map(g=>`<div class="li">${av(pname(p,g.pagou),'s')}<div class="grow"><div class="t" style="font-size:17px">${esc(g.desc)}</div><div class="m">${esc(pname(p,g.pagou))} pagou · divide por ${(g.parts||[]).length}</div></div><div class="money">${brl(g.valor)}</div><button class="btn sm alt" data-act="edg" data-v="${g.id}" aria-label="Mudar ${esc(g.desc)}">Mudar</button></div>`).join('')}</div>
<h2>Lançar um gasto</h2><label class="f" for="gd" style="margin-top:0">O que foi</label><input id="gd" placeholder="Combustível, rancho, mercado…">
<div style="display:flex;gap:8px;margin-top:8px"><input id="gv" type="text" inputmode="decimal" autocomplete="off" placeholder="Valor (R$)"><select id="gp" aria-label="Quem pagou">${ppl.map(x=>`<option value="${x.id}" ${x.id===eu?'selected':''}>${esc(x.nome)} pagou</option>`).join('')}</select></div>
<label class="f">Divide entre</label><div class="parts">${ppl.map(x=>`<label class="chip" style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" class="gpart" value="${x.id}" checked>${esc(x.nome)}</label>`).join('')}</div>
<button class="btn full" data-act="addg" style="margin-top:12px">Lançar gasto</button>`}

${mode==='cloud'&&user?`<button class="btn alt full" data-act="apagarConta" style="color:var(--warn)">Apagar minha conta</button>`:''}</div>`}
let pending=null;
function render(){try{renderInner()}catch(e){console.error(e);const a=$('#app');if(a)a.removeAttribute('data-ok');window.__falhou&&window.__falhou(e.message)}}
function renderInner(){
const app=$('#app');if(!app)return;
const fx=document.activeElement&&document.activeElement.id;
let h=!authReady?'<h1>'+esc(APP)+'</h1><div class="box">Abrindo…</div>':(mode==='cloud'&&!user)?vLogin():S.tab==='explorar'?vExplorar():S.tab==='pescarias'?vPescarias():vContas();
if(flashMsg)h+=`<div class="warnbox" role="status" style="position:fixed;left:18px;right:18px;bottom:96px;max-width:484px;margin:0 auto;z-index:8">${esc(flashMsg)}</div>`;
/* guarda o que a pessoa está digitando, para uma atualização da tela não apagar */
const keep={};if(!window.__limpar)app.querySelectorAll('input[id],select[id]:not([data-act])').forEach(el=>{if(el.type!=='checkbox'&&el.value)keep[el.id]=el.value});
const keepChk={};let hadChk=false;app.querySelectorAll('input.gpart').forEach(el=>{hadChk=true;keepChk[el.value]=el.checked});
const pos=fx&&document.activeElement&&document.activeElement.selectionStart;
app.innerHTML=h;app.setAttribute('data-ok','1');
Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&el.closest('#app')&&!el.value)el.value=v});
if(hadChk)app.querySelectorAll('input.gpart').forEach(el=>{if(el.value in keepChk)el.checked=keepChk[el.value]});
if(fx&&fx!=='q'){const el=document.getElementById(fx);if(el&&el.closest('#app')){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
$('#nav').style.display=(mode==='cloud'&&!user)?'none':'';$('#nav').innerHTML=[['pescarias','Pescarias',I.boat],['contas','Contas',I.cash],['explorar','Explorar',I.search]].map(([k,l,i])=>`<a href="#${k}" class="${S.tab===k?'on':''}"${S.tab===k?' aria-current="page"':''}><i>${i}</i>${l}</a>`).join('');
if(fx==='q'){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
const openModal=h=>{$('#modal').innerHTML=h;const i=$('#modal input');if(i)i.focus()};
const closeModal=()=>{$('#modal').innerHTML='';pending=null};

const pendingCid=()=>S.tab==='contas'?($('[data-act=cid]')?.value):S.pid;
function curP(){return S.tab==='contas'?getP($('[data-act=cid]')?.value):getP(S.pid)}
function change(fn){const p=curP();if(!p)return;store().change(p.id,fn)}

document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
document.addEventListener('change',e=>{const a=e.target.dataset.act;if(a==='eu'){setMe(S.pid,e.target.value)}else if(a==='reg'){S.reg=e.target.value;render()}else if(a==='quem'){const v=e.target.dataset.v;change(p=>{const it=p.itens.find(i=>i.id===v);if(it)it.quem=e.target.value})}else if(a==='cid'){S.cid=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
document.addEventListener('click',async e=>{
const el=e.target.closest('[data-act]');if(!el)return;
if(el.dataset.stop&&!e.target.closest('[data-act]:not([data-stop])'))return;
const a=el.dataset.act,v=el.dataset.v;
if(['addp','addi','addr','addg','adddata','souNovo'].includes(a)){window.__limpar=true;setTimeout(()=>{window.__limpar=false},0)}

else if(a==='pil'){S.pil=!S.pil;render()}
else if(a==='ad'){S.ad=v;render();scrollTo(0,0)}
else if(a==='unad'){S.ad=null;render()}

openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">${ad.cat==='Roteiro'?'Usar este roteiro em qual pescaria?':'Pôr em qual pescaria?'}</h2>${fut.map(p=>`<button class="btn alt full" data-act="addad" data-v="${esc(p.id)}" style="margin-top:8px;justify-content:flex-start">${esc(p.nome)}</button>`).join('')}<button class="btn full" data-act="novaad" style="margin-top:14px">${I.plus}Criar pescaria nova</button></div></div>`)}
else if(a==='novaad'){const ad=pending;closeModal();pending=ad;openModal(vNova({nome:ad.cat==='Roteiro'?ad.nome:'Pescaria em '+ad.local.split(',')[0],local:ad.cat==='Roteiro'?ad.local:ad.nome+' · '+ad.local}))}
else if(a==='addad'){const ad=pending;if(!ad)return;closeModal();store().change(v,p=>{if(ad.cat==='Roteiro'){p.roteiro=(p.roteiro||[]).concat(ad.dias.map(d=>({id:uid(),dia:d[0],hora:d[1],txt:d[2]})));const tem=(p.itens||[]).map(i=>norm(i.txt));(ad.levar||[]).forEach(t=>{if(!tem.includes(norm(t)))p.itens.push({id:uid(),txt:t,quem:'',ok:false})})}else{p.local=ad.nome+' · '+ad.local}p.anuncios=(p.anuncios||[]).filter(x=>x!==ad.id).concat([ad.id])});S.tab='pescarias';S.pid=v;S.sub=ad.cat==='Roteiro'?'roteiro':'turma';S.ad=null;location.hash='pescarias';render();scrollTo(0,0);flash(ad.cat==='Roteiro'?'Roteiro e lista do que levar adicionados.':'Lugar adicionado na pescaria.')}

const ro=pending&&pending.dias?pending.dias.map(d=>({id:uid(),dia:d[0],hora:d[1],txt:d[2]})):[];
const p={id:pid,nome,local:$('#nl').value.trim(),inicio:$('#ni1').value||'',fim:$('#ni2').value||$('#ni1').value||'',criado:Date.now(),pessoas:[{id:meid,nome:eu,pix:''}],datas:[],itens:((pending&&pending.levar)||['Gelo','Isca','Carne e carvão','Licença de pesca']).map(t=>({id:uid(),txt:t,quem:'',ok:false})),roteiro:ro,gastos:[],pagos:{}};
closeModal();const nid=await store().create(p);if(!nid)return;ls.set('bp_me_'+nid,meid);S.tab='pescarias';S.pid=nid;S.sub='turma';S.ad=null;location.hash='pescarias';render();scrollTo(0,0)}
else if(a==='souEu'){setMe(S.pid,v);scrollTo(0,0)}
else if(a==='souNovo'){const n=$('#nq').value.trim();if(!n){$('#nq').focus();return}const nid=uid();setMe(S.pid,nid);change(p=>{p.pessoas.push({id:nid,nome:n,pix:''})})}
else if(a==='google'){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)flash('Não deu para entrar com Google agora.')}
else if(a==='mandaCodigo'){const em=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(em)){flash('Confira o e-mail.');return}el.disabled=true;const conv=ls.get('bp_convite','');const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname+(conv?'?c='+encodeURIComponent(conv):'')}});el.disabled=false;if(error){flash('Não deu para mandar o código. Tente daqui a 1 minuto.');return}S.email=em;render()}
else if(a==='confereCodigo'){const tk=$('#cod').value.replace(/\D/g,'');if(tk.length<6){flash('Digite o código inteiro.');return}const {error}=await sb.auth.verifyOtp({email:S.email,token:tk,type:'email'});if(error)flash('Código errado ou vencido. Confira o e-mail.')}
else if(a==='outroEmail'){S.email='';render()}
else if(a==='sair'){await sb.auth.signOut();P=[];S.pid=null;render()}
else if(a==='apagarConta'){openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Apagar sua conta?</h2><p>Você sai de todas as pescarias. As pescarias que você criou são apagadas para toda a turma. Não dá para desfazer.</p><button class="btn full" data-act="apagarOk" style="background:var(--warn)">Apagar minha conta</button><button class="btn alt full" data-act="mclose" style="margin-top:8px">Cancelar</button></div></div>`)}
else if(a==='apagarOk'){const {error}=await sb.rpc('apagar_minha_conta');closeModal();if(error){flash('Não deu para apagar agora.');return}await sb.auth.signOut();P=[];render()}
else if(a==='open'){S.pid=v;S.sub='turma';render();scrollTo(0,0)}
else if(a==='close'){S.pid=null;render()}
else if(a==='sub'){S.sub=v;render()}
else if(a==='addp'){const n=$('#np').value.trim();if(!n)return;change(p=>{p.pessoas.push({id:uid(),nome:n,pix:''})})}
else if(a==='rmp'){change(p=>{p.pessoas=p.pessoas.filter(x=>x.id!==v)})}
else if(a==='pixkey'){const p=curP();const x=p.pessoas.find(y=>y.id===v);openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Chave Pix de ${esc(x.nome)}</h2><p class="m">Usada para gerar a cobrança quando alguém precisar pagar ${esc(x.nome)}.</p><label class="f" for="pk">Chave (CPF, celular, e-mail ou aleatória)</label><input id="pk" value="${esc(x.pix||'')}"><label class="f" for="pc">Cidade</label><input id="pc" value="${esc(x.cidade||'')}" placeholder="Bauru"><button class="btn full" data-act="savepix" data-v="${x.id}" style="margin-top:14px">Salvar</button></div></div>`)}
else if(a==='savepix'){const k=$('#pk').value.trim(),c=$('#pc').value.trim();change(p=>{const x=p.pessoas.find(y=>y.id===v);if(x){x.pix=k;x.cidade=c}});closeModal()}
else if(a==='adddata'){const i=$('#di').value,f2=$('#df').value;if(!i)return;change(p=>{p.datas=p.datas||[];p.datas.push({id:uid(),ini:i,fim:f2||i,votos:[]})})}
else if(a==='vote'){const eu=me(S.pid);change(p=>{const o=p.datas.find(x=>x.id===v);if(!o)return;o.votos=o.votos||[];o.votos=o.votos.includes(eu)?o.votos.filter(x=>x!==eu):[...o.votos,eu]})}
else if(a==='pick'){change(p=>{const o=p.datas.find(x=>x.id===v);if(o){p.inicio=o.ini;p.fim=o.fim}});flash('Data fechada!')}
else if(a==='tick'){change(p=>{const it=p.itens.find(i=>i.id===v);if(it)it.ok=!it.ok})}
else if(a==='rmi'){change(p=>{p.itens=p.itens.filter(i=>i.id!==v)})}
else if(a==='addi'){const t=$('#ni').value.trim();if(!t)return;change(p=>{p.itens.push({id:uid(),txt:t,quem:'',ok:false})})}
else if(a==='addr'){const t=$('#rt').value.trim();if(!t)return;change(p=>{p.roteiro=p.roteiro||[];p.roteiro.push({id:uid(),dia:$('#rd').value.trim(),hora:$('#rh').value,txt:t})})}
else if(a==='rmr'){change(p=>{p.roteiro=p.roteiro.filter(r=>r.id!==v)})}
else if(a==='addg'){const d=$('#gd').value.trim();const val=valorBR($('#gv').value);const parts=[...document.querySelectorAll('.gpart:checked')].map(x=>x.value);if(!d||!(val>0)){flash('Preencha o gasto e o valor.');return}if(!parts.length){flash('Escolha quem divide.');return}change(p=>{p.gastos=p.gastos||[];p.gastos.push({id:uid(),desc:d,valor:Math.round(val*100)/100,pagou:$('#gp').value,parts})})}
else if(a==='lic'){const p=curP();const x=p.pessoas.find(y=>y.id===v);if(!x)return;openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Licença de pesca de ${esc(x.nome)}</h2><p class="m">Na pesca amadora, cada pescador precisa da licença em dia. Ela é tirada no site do Ministério da Pesca (gov.br). Informe até quando a licença vale.</p><label class="f" for="lv">Vale até</label><input id="lv" type="date" value="${esc(x.lic||'')}"><button class="btn full" data-act="savelic" data-v="${x.id}" style="margin-top:14px">Salvar</button>${x.lic?`<button class="btn ghost full" data-act="clrlic" data-v="${x.id}">Tirar a data</button>`:''}</div></div>`)}
else if(a==='savelic'){const d=$('#lv').value;if(!d){$('#lv').focus();return}change(p=>{const x=p.pessoas.find(y=>y.id===v);if(x)x.lic=d});closeModal()}
else if(a==='clrlic'){change(p=>{const x=p.pessoas.find(y=>y.id===v);if(x)delete x.lic});closeModal()}
else if(a==='edg'){const p=curP();const g=(p.gastos||[]).find(y=>y.id===v);if(!g)return;const ppl=p.pessoas||[];openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Mudar gasto</h2>
<label class="f" for="egd">O que foi</label><input id="egd" value="${esc(g.desc)}">
<label class="f" for="egv">Valor (R$)</label><input id="egv" type="text" inputmode="decimal" autocomplete="off" value="${esc(String(g.valor).replace('.',','))}">
<label class="f" for="egp">Quem pagou</label><select id="egp">${ppl.map(x=>`<option value="${x.id}" ${x.id===g.pagou?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
<label class="f">Divide entre</label><div class="parts">${ppl.map(x=>`<label class="chip" style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" class="egpart" value="${x.id}" ${(g.parts||[]).includes(x.id)?'checked':''}>${esc(x.nome)}</label>`).join('')}</div>
<button class="btn full" data-act="saveg" data-v="${g.id}" style="margin-top:16px">Salvar</button><button class="btn ghost full" data-act="rmg" data-v="${g.id}">Apagar este gasto</button></div></div>`)}
else if(a==='saveg'){const d=$('#egd').value.trim();const val=valorBR($('#egv').value);const parts=[...document.querySelectorAll('.egpart:checked')].map(x=>x.value);if(!d||!(val>0)){flash('Preencha o gasto e o valor.');return}if(!parts.length){flash('Escolha quem divide.');return}const pg=$('#egp').value;change(p=>{const g=p.gastos.find(y=>y.id===v);if(g){g.desc=d;g.valor=val;g.pagou=pg;g.parts=parts}});closeModal()}
else if(a==='rmg'){closeModal();change(p=>{p.gastos=p.gastos.filter(g=>g.id!==v)})}
else if(a==='pago'){change(p=>{p.pagos=p.pagos||{};p.pagos[v]=true})}
else if(a==='unpago'){change(p=>{p.pagos=p.pagos||{};delete p.pagos[v]})}
else if(a==='pixgo'){const p=curP();const [de,para]=v.split('>');const x=p.pessoas.find(y=>y.id===para);const val=Number(el.dataset.n);
if(!x||!x.pix){openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Falta a chave Pix</h2><p>${esc(x?x.nome:'')} ainda não cadastrou a chave Pix. Vá em Turma e toque em Pix ao lado do nome.</p><button class="btn full" data-act="mclose">Entendi</button></div></div>`);return}
const code=pix(x.pix,x.nome,x.cidade,val);openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">${esc(pname(p,de))} paga ${brl(val)} para ${esc(x.nome)}</h2><p class="m">Copie o código e cole no app do banco, em Pix copia e cola.</p><textarea class="code" readonly id="pixcode">${esc(code)}</textarea><button class="btn full" data-act="copy" data-t="pixcode" style="margin-top:12px">Copiar código Pix</button><button class="btn alt full" data-act="mclose" style="margin-top:8px">Fechar</button></div></div>`)}
else if(a==='copy'){const t=$('#'+el.dataset.t);try{await navigator.clipboard.writeText(t.value);el.textContent='Copiado!'}catch(err){t.select();el.textContent='Selecione e copie'}}
else if(a==='wa'){const p=curP();if(!p)return;const txt=waText(p,v);openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Mensagem pronta</h2><p class="m">Confira e toque em Abrir WhatsApp. Lá você escolhe o grupo da turma.</p><textarea class="code" readonly id="watxt" style="font-family:inherit;font-size:16px;height:220px">${esc(txt)}</textarea><button class="btn wa full" data-act="waopen" style="margin-top:12px">Abrir WhatsApp</button><button class="btn alt full" data-act="copy" data-t="watxt" style="margin-top:8px">Só copiar o texto</button></div></div>`)}
else if(a==='waopen'){waOpen($('#watxt').value)}
else if(a==='convite'){const p=curP();const txt=`Bora pescar? ${p.nome}${p.local?' em '+p.local:''}${p.inicio?', '+fmtD(p.inicio)+(p.fim&&p.fim!==p.inicio?' a '+fmtD(p.fim):''):''}. Entra no app ${APP}, abre a pescaria e confirma presença.`;openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Convite</h2><textarea class="code" readonly id="cv" style="font-family:inherit;font-size:15px">${esc(txt)}</textarea><button class="btn full" data-act="copy" data-t="cv" style="margin-top:12px">Copiar convite</button></div></div>`)}
else if(a==='delp'){openModal(`<div class="modal" data-act="mclose"><div class="sheet" data-stop="1"><h2 style="margin-top:0">Apagar esta pescaria?</h2><p>Some para toda a turma, com gastos e lista.</p><button class="btn full" data-act="delok" style="background:var(--warn)">Apagar</button><button class="btn alt full" data-act="mclose" style="margin-top:8px">Cancelar</button></div></div>`)}
else if(a==='delok'){store().del(S.pid);S.pid=null;closeModal()}
});
(()=>{const q=new URLSearchParams(location.search);const c=q.get('c');if(c){ls.set('bp_convite',c);history.replaceState(null,'',location.pathname+location.hash)}})();
const route=()=>{const h=location.hash.slice(1);if(h.startsWith('c=')){const c=h.slice(2);history.replaceState(null,'','#pescarias');if(mode==='local'){flash('Convite só funciona com o app ligado na internet.')}else if(user){cloud.join(c).then(id=>{if(id){S.tab='pescarias';S.pid=id;S.sub='turma';render()}})}else{ls.set('bp_convite',c);S.convidado=true}}S.tab=['explorar','pescarias','contas'].includes(h)?h:'pescarias';if(S.tab!=='explorar')S.ad=null;if(S.tab!=='pescarias')S.pid=null;render();scrollTo(0,0)};
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
