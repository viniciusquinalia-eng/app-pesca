<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turma da Pesca</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5A50">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: simples e direto, como app de banco e de hospedagem; letra grande para todas as idades
   IDEA: o caderninho da pescaria da turma, no bolso
   PICTURE: cenas planas de rio, rancho e barco nos cards
   COLOUR and TYPE: branco, verde-rio #0F5A50 dominante, amarelo-tucunaré só em detalhes; Inter
   LAYOUT: coluna de celular, menu de 3 abas embaixo, um assunto por tela */
:root{color-scheme:light;
--bg:#ffffff;--card:#ffffff;--soft:#f4f6f5;--soft2:#eef2f0;
--ink:#0b2e33;--ink2:#2c4a4e;--mute:#5a6b68;--line:#e4eae8;
--brand:#0f5a50;--brand2:#0b463e;--brandsoft:#e6f0ed;--onbrand:#ffffff;--sun:#f2b035;--sunsoft:#fdf1d6;
--warn:#a33f0b;--warnbg:#fdeee3;--wa:#1d7a4c;
--sh:0 1px 2px rgba(11,46,51,.05),0 6px 20px rgba(11,46,51,.07);--r:22px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 18px 120px}
h1{font-size:32px;line-height:1.08;letter-spacing:-.03em;margin:22px 0 16px;font-weight:800;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em;margin:28px 0 12px;font-weight:700}
.eyebrow{font-size:15px;font-weight:600;color:var(--mute);margin:26px 0 -14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:56px;padding:0 22px;border-radius:16px;border:0;background:var(--brand);color:var(--onbrand);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.full{width:100%}
.btn.ghost{background:none;color:var(--warn);min-height:52px}
.btn.sm{min-height:48px;padding:0 18px;font-size:16px;border-radius:14px}
.btn.wa{background:var(--wa);color:#fff}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,.back:focus-visible,.check:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select{width:100%;height:56px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;background:var(--card);font-size:17px;transition:border-color .15s}
input:focus,select:focus{border-color:var(--brand);outline:none}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
label.f{display:block;font-size:16px;font-weight:600;color:var(--ink2);margin:16px 0 8px}
.search{display:flex;align-items:center;gap:10px;height:58px;border-radius:29px;padding:0 20px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line)}
.search input{border:0;height:auto;padding:0;background:transparent;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:48px;padding:0 18px;border-radius:24px;border:0;background:var(--soft);font-size:16px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--brand);color:var(--onbrand)}
.card{display:block;width:100%;text-align:left;border:0;background:none;padding:0;margin:18px 0 6px;color:inherit}
.pic{border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/10;background:#f4c46e}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic img.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:12px;top:12px;background:#fff;color:#0b2e33;font-size:15px;font-weight:700;padding:6px 12px;border-radius:14px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-top:10px}
.t{font-size:18px;font-weight:700;letter-spacing:-.01em}.m{color:var(--mute);font-size:16px}.price{font-weight:700;white-space:nowrap}
.note{font-size:15px;color:var(--mute);margin:14px 0 0}
.box{background:var(--soft);border-radius:18px;padding:16px 18px;margin:12px 0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:14px 16px;font-size:16px;margin-top:14px}
.money,.big,.num{font-variant-numeric:tabular-nums}
/* cartão de pescaria */
.pcard{background:var(--card);border-radius:26px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.pcard .pic{border-radius:0;aspect-ratio:16/7}
.pcard .body{padding:16px 18px 18px}
.count{position:absolute;left:14px;bottom:14px;background:var(--sun);color:#3a2a00;font-weight:800;font-size:16px;padding:7px 14px;border-radius:999px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);font-size:16px;margin-top:2px}
.faces{display:flex;align-items:center;margin-top:14px}
.faces .av{margin-left:-8px;box-shadow:0 0 0 3px #fff}.faces .av:first-child{margin-left:0}
.faces span.m{margin-left:10px}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:17px;color:#fff}
.av.s{width:36px;height:36px;font-size:15px}
/* cabeçalho da pescaria */
.top{position:relative;margin:0 -18px}
.top .pic{border-radius:0 0 28px 28px;aspect-ratio:16/9}
.top .back{position:absolute;left:14px;top:14px;margin:0;background:rgba(255,255,255,.92);box-shadow:var(--sh)}
.title{margin:18px 0 0}
.title h1{margin:0 0 6px}
/* abas da pescaria */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
/* listas agrupadas */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1}
.ic{width:48px;height:48px;border-radius:14px;background:var(--brandsoft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(12px + env(safe-area-inset-bottom));z-index:5}
.nav a{flex:1 1 0;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--mute);text-decoration:none;padding:2px 0;min-height:56px}
.nav a i{display:flex;align-items:center;justify-content:center;width:60px;height:32px;border-radius:16px;font-style:normal}
.nav a.on{color:var(--brand)}.nav a.on i{background:var(--brandsoft)}
.back{width:48px;height:48px;border-radius:24px;border:0;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;margin-top:18px;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.stat{border:1px solid var(--line);border-radius:16px;padding:14px}.stat .n{font-size:24px;font-weight:800;color:var(--brand)}.stat .m{font-size:16px}
.dgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}.dcard{padding:0;overflow:hidden}
.fotobox{display:flex;align-items:center;justify-content:center;min-height:180px;border:2px dashed var(--line);border-radius:16px;cursor:pointer;font-size:17px;font-weight:600;color:var(--brand);overflow:hidden}.fotobox span{display:flex;gap:8px;align-items:center}.fotobox img{width:100%;max-height:320px;object-fit:cover;display:block}
.star{width:48px;height:48px;border:0;background:none;font-size:34px;color:#d9dfdc;cursor:pointer;padding:0}.star.on{color:#F2B035}
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.gal .slide{flex:0 0 100%;position:relative;scroll-snap-align:start;overflow:hidden}
.galbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0F5A50;font-size:30px;line-height:1;font-weight:700;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.galn{position:absolute;right:14px;bottom:14px;background:rgba(0,0,0,.6);color:#fff;font-size:16px;font-weight:700;padding:6px 12px;border-radius:999px;z-index:2}
.fthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.fthumbs div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}.fthumbs img{width:100%;height:100%;object-fit:cover;display:block}.fthumbs button{position:absolute;top:4px;right:4px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--warn);font-size:22px;font-weight:800}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.feat div{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:15px;font-weight:600}
.sticky{position:fixed;left:0;right:0;bottom:84px;background:var(--bg);border-top:1px solid var(--line)}
.sticky>div{max-width:520px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.check{width:44px;height:44px;border-radius:12px;border:2px solid #b9c9c5;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:var(--onbrand)}
.check.on{background:var(--brand);border-color:var(--brand)}
.x{border:0;background:none;color:var(--mute);font-size:26px;width:48px;height:48px;border-radius:24px;flex:none}
.money{font-weight:800;white-space:nowrap}
.pill{font-size:15px;font-weight:700;color:var(--brand)}
/* contas */
.saldo{background:var(--brand);color:var(--onbrand);border-radius:26px;padding:22px 22px 20px;margin:16px 0 4px}
.saldo .lbl{display:inline-flex;align-items:center;gap:8px;font-weight:600;opacity:.92}
.saldo .lbl:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun)}
.saldo .big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.saldo .sub{opacity:.85;font-size:16px}
.tr{padding:16px}
.tr .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr .arrow{color:var(--mute)}
.tr .acts{display:flex;gap:8px;margin-top:12px}.tr .acts .btn{flex:1}
.tr.pago .who,.tr.pago .money{opacity:.5}
.hero{background:var(--brand);color:var(--onbrand);border-radius:26px;padding:22px;margin:4px 0 8px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0}
.share{background:var(--brandsoft);border-radius:var(--r);padding:18px;margin-top:28px}
.share h2{margin:0 0 4px}
.modal{position:fixed;inset:0;background:rgba(6,24,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:12px 20px 30px;max-height:90vh;overflow:auto}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
textarea.code{width:100%;height:110px;border-radius:14px;border:1.5px solid var(--line);padding:12px;font:15px/1.45 ui-monospace,monospace;background:var(--soft);color:var(--ink);overflow-wrap:anywhere}
.status{font-size:15px;color:var(--mute);text-align:center;margin-top:10px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts .chip{background:var(--card);border:1.5px solid var(--line)}
.parts .chip:has(input:checked){background:var(--brandsoft);border-color:var(--brand);color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>

const base={};const pend={};
const rowToP=r=>({...r.dados,id:r.id,_v:r.versao,_convite:r.convite});

 async list(){if(!user)return;loading=!P.length;render();

  loading=false;if(error){console.error('minhas_pescarias',error);loadNote='Não deu para carregar as pescarias. Confira a internet.';render();return}
  loadNote='';data.forEach(r=>{base[r.id]=rowToP(r)});P=data.map(r=>view(r.id));render()},

  const r=data[0];base[r.id]={...clone(dados),id:r.id,_v:1,_convite:r.convite};putLocal(view(r.id));render();return r.id},
 change(id,fn){if(!base[id])return;(pend[id]=pend[id]||[]).push(fn);putLocal(view(id));render();
  queue[id]=(queue[id]||Promise.resolve()).then(()=>cloud._send(id,fn)).catch(e=>{console.error(e);pend[id]=(pend[id]||[]).filter(f=>f!==fn);putLocal(view(id));render();flash('Não salvou agora. Confira a internet e tente de novo.')})},
 async _send(id,fn){
  for(let t=0;t<6;t++){
   const c=clone(base[id]);fn(c);const {id:_i,_v,_convite,...dados}=c;
   const {data,error}=await sb.rpc('salvar_pescaria',{p_id:id,p_dados:dados,p_versao:base[id]._v});
   if(error)throw error;
   if(data>0){c._v=data;base[id]=c;pend[id]=(pend[id]||[]).filter(f=>f!==fn);putLocal(view(id));render();return}
   /* outra pessoa mexeu ao mesmo tempo: busca a versão nova e refaz a mudança em cima dela */
   const r=await sb.rpc('minhas_pescarias',{p_id:id});
   if(r.error||!r.data||!r.data.length)throw r.error||new Error('sumiu');base[id]=rowToP(r.data[0]);putLocal(view(id));render()}
  throw new Error('conflito')},
 async del(id){P=P.filter(x=>x.id!==id);render();const {error}=await sb.rpc('apagar_pescaria',{p_id:id});if(error)flash('Não apagou agora.')},

const balances=p=>{const b={};(p.pessoas||[]).forEach(x=>b[x.id]=0);(p.gastos||[]).forEach(g=>{const parts=(g.parts||[]).filter(id=>id in b);if(!parts.length||!(g.pagou in b))return;b[g.pagou]+=g.valor;const share=g.valor/parts.length;parts.forEach(id=>b[id]-=share)});return b};
const settle=p=>{const b=balances(p);const cred=[],deb=[];Object.entries(b).forEach(([id,v])=>{if(v>0.009)cred.push([id,v]);else if(v<-0.009)deb.push([id,-v])});cred.sort((a,c)=>c[1]-a[1]);deb.sort((a,c)=>c[1]-a[1]);const out=[];let i=0,j=0;while(i<deb.length&&j<cred.length){const v=Math.min(deb[i][1],cred[j][1]);out.push({de:deb[i][0],para:cred[j][0],v:Math.round(v*100)/100});deb[i][1]-=v;cred[j][1]-=v;if(deb[i][1]<0.009)i++;if(cred[j][1]<0.009)j++}return out};
const valorBR=t=>{t=String(t||'').replace(/[^0-9.,]/g,'');if(!t)return NaN;const c=t.lastIndexOf(','),d=t.lastIndexOf('.');let dec=c>d?',':(d>c&&t.length-d-1!==3?'.':null);if(dec===null&&c<0&&d>=0&&(t.match(/\./g)||[]).length===1&&t.length-d-1!==3)dec='.';let n=dec?t.slice(0,t.lastIndexOf(dec)).replace(/[.,]/g,'')+'.'+t.slice(t.lastIndexOf(dec)+1):t.replace(/[.,]/g,'');return Math.round(parseFloat(n)*100)/100};

const crc=s=>{let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};

/* ---------- perfil e histórico ---------- */
const fimDe=p=>p.fim||p.inicio;
const feita=p=>!!p.inicio&&daysTo(fimDe(p))<0;
const diasDe=p=>p.inicio?Math.max(1,Math.round((Date.parse(fimDe(p))-Date.parse(p.inicio))/864e5)+1):0;
const minhaParte=p=>{const eu=me(p.id);if(!eu)return 0;return (p.gastos||[]).reduce((s,g)=>{const n=(g.parts||[]).length;return s+(n&&g.parts.includes(eu)?g.valor/n:0)},0)};
const cidade=l=>String(l||'').split('·').pop().split(',')[0].replace(/\(.*?\)/g,'').replace(/^\s*(represa|rio|lago)\s+(de|do|da)\s+/i,'').trim();
function vPerfil(){
if(S.pv==='novo')return vNovoDiario();
const nome=ls.get('bp_nome','')||(user&&user.email?user.email.split('@')[0]:'');
const feitas=P.filter(feita).sort((a,b)=>b.inicio.localeCompare(a.inicio));const prox=P.filter(p=>!feita(p));
const dias=feitas.reduce((s,p)=>s+diasDe(p),0);const lugares=[...new Set(feitas.map(p=>cidade(p.local)).filter(Boolean))];
const gasto=feitas.reduce((s,p)=>s+minhaParte(p),0);
const stat=(n,l)=>`<div class="stat"><div class="n">${n}</div><div class="m">${l}</div></div>`;
return `<div style="display:flex;align-items:center;gap:14px;margin-top:8px">${av(nome||'?')}<div><p class="eyebrow" style="margin:0">Seu perfil</p><h1 style="margin:0">${esc(nome||'Pescador')}</h1></div></div>
<div class="stats">${stat(feitas.length,feitas.length===1?'pescaria feita':'pescarias feitas')}${stat(dias,dias===1?'dia de pesca':'dias de pesca')}${stat(lugares.length,lugares.length===1?'lugar':'lugares')}${stat(brl(gasto),'sua parte nos gastos')}</div>
${typeof vDiarioResumo==='function'?vDiarioResumo():''}
<h2>Histórico</h2>
${feitas.length?`<div class="list">${feitas.map(p=>`<button class="li card" data-act="openp" data-v="${esc(p.id)}" style="text-align:left;width:100%"><div class="ic" style="width:auto;padding:0 10px">${esc(p.inicio.slice(0,4))}</div><div class="grow"><div class="t" style="font-size:17px">${esc(p.nome)}</div><div class="m">${esc(quandoTxt(p))}${p.local?' · '+esc(p.local):''}</div><div class="m">${diasDe(p)} ${diasDe(p)===1?'dia':'dias'} · ${(p.pessoas||[]).length} na turma${minhaParte(p)?' · você gastou '+brl(minhaParte(p)):''}</div></div></button>`).join('')}</div>`:'<div class="box">Quando uma pescaria passar da data de volta, ela aparece aqui, com os dias, o lugar e quanto você gastou.</div>'}
${lugares.length?`<h2>Lugares onde já pescou</h2><div class="chips">${lugares.map(l=>`<span class="chip" style="cursor:default">${esc(l)}</span>`).join('')}</div>`:''}
${prox.length?`<div class="box" style="margin-top:18px">Você tem <b>${prox.length} ${prox.length===1?'pescaria':'pescarias'}</b> pela frente. <a href="#pescarias" style="color:var(--brand);font-weight:700">Ver</a></div>`:''}
${vRodape()}`}

/* ---------- clima (Open-Meteo, grátis, sem cadastro) ---------- */
const WX={};
const WTXT=c=>c===0?'Sol':c<=2?'Sol com nuvens':c===3?'Nublado':c<=48?'Neblina':c<=57?'Garoa':c<=67?'Chuva':c<=77?'Frio intenso':c<=82?'Pancadas de chuva':'Temporal';
const SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
async function geo(c){const k='bp_geo_'+norm(c);const g=ls.get(k,null);if(g)return g;
 const j=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&countryCode=BR&name='+encodeURIComponent(c))).json();
 const x=j&&j.results&&j.results[0];if(!x)return null;const o={lat:x.latitude,lon:x.longitude,nome:x.name+(x.admin1?', '+x.admin1:'')};ls.set(k,o);return o}
function clima(local,ini,fim){const c=cidade(local);if(!c)return null;const k=c+'|'+(ini||'agora')+'|'+(fim||'');
 if(WX[k]&&!(WX[k].st==='ok'&&Date.now()-WX[k].t>3*36e5))return WX[k];WX[k]={st:'carregando'};
 (async()=>{try{const g=await geo(c);if(!g){WX[k]={st:'sem'};render();return}
  let u='https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+'&timezone=America%2FSao_Paulo&wind_speed_unit=kmh';
  u+=ini?'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&start_date='+ini+'&end_date='+(fim||ini):'&current=temperature_2m,weather_code,wind_speed_10m';
  const j=await (await fetch(u)).json();WX[k]=j&&!j.error?{st:'ok',g,j,t:Date.now()}:{st:'sem'}}catch(e){WX[k]={st:'erro'}}render()})();
 return WX[k]}
const addDias=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
function vClimaPescaria(p){if(!p.inicio||!p.local||daysTo(fimDe(p))<0)return '';const c=cidade(p.local);if(!c)return '';
 if(daysTo(p.inicio)>15)return `<div class="box wx" style="margin-top:16px"><b>Tempo em ${esc(c)}</b><br>A previsão aparece a partir de ${esc(fmtD(addDias(p.inicio,-15)))}, 16 dias antes da viagem.</div>`;
 const ini=daysTo(p.inicio)<0?today():p.inicio;let fim=fimDe(p);if(daysTo(fim)>15)fim=addDias(today(),15);
 const w=clima(p.local,ini,fim);if(!w||w.st==='carregando')return `<div class="box wx" style="margin-top:16px"><b>Tempo em ${esc(c)}</b><br><span class="m">Buscando a previsão…</span></div>`;
 if(w.st!=='ok')return '';const d=w.j.daily;if(!d||!d.time)return '';
 return `<div class="box wx" style="margin-top:16px"><b>Previsão do tempo · ${esc(w.g.nome)}</b><div class="list" style="margin-top:6px;border:0;background:none;box-shadow:none;padding:0">${d.time.map((t,i)=>{const ch=d.precipitation_probability_max[i],vt=d.wind_speed_10m_max[i];const ruim=ch>=70||vt>=35;return `<div class="li" style="padding:10px 0;${ruim?'color:var(--warn)':''}"><div class="ic" style="width:auto;min-width:56px;padding:0 6px">${SEM[new Date(t+'T12:00').getDay()]} ${Number(t.slice(8))}</div><div class="grow"><div class="t" style="font-size:17px">${WTXT(d.weather_code[i])} · ${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div><div class="m" style="${ruim?'color:var(--warn)':''}">Chuva ${ch==null?'?':ch+'%'} · vento até ${Math.round(vt)} km/h${ruim?' · atenção no barco':''}</div></div></div>`}).join('')}</div><p class="m" style="margin:6px 0 0">Previsão do Open-Meteo. Confira de novo na véspera.</p></div>`}

async function prepFoto(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});

 let q=.75,b=null;do{b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.15}while(b&&b.size>300000&&q>.3);return b}finally{URL.revokeObjectURL(url)}}
